<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query Example</title>
    <link rel="stylesheet" href="task5.css">
</head>

<body>

    <div class="header">
        <h1>Responsive Layout Practice</h1>
    </div>

    <div class="row">

        <div class="col">
            <h3>Column One</h3>
            <p>
                These columns are side-by-side on a large screen.
                On a small screen, they move one below another.
            </p>
        </div>

        <div class="col">
            <h3>Column Two</h3>
            <p>
                The media query changes the layout when the screen
                width is 600px or less.
            </p>
        </div>

    </div>

</body>
</html>

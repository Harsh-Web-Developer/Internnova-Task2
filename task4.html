<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Example</title>
    <link rel="stylesheet" href="task4.css">
</head>

<body>

    <h1>CSS Grid Layout</h1>

    <div class="grid">

        <div class="box featured">
            <h3>Main Featured Area</h3>
            <p>This box takes up two columns in the grid.</p>
        </div>

        <div class="box">
            <h3>Sidebar Box</h3>
            <p>This box is placed in the third column.</p>
        </div>

        <div class="box">
            <h3>Box 1</h3>
            <p>This box is in the second row.</p>
        </div>

        <div class="box">
            <h3>Box 2</h3>
            <p>This box is also in the second row.</p>
        </div>

        <div class="box">
            <h3>Box 3</h3>
            <p>This is the last box in the grid.</p>
        </div>

    </div>

</body>
</html>
